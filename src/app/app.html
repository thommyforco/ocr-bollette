<div class="bg-gray-100 min-h-screen flex flex-col items-center py-10 p-4">
  <div class="bg-white p-8 rounded-xl shadow-lg max-w-3xl w-full">
      <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Analisi Bolletta e Calcolo Risparmio</h1>

      <!-- Area OCR -->
      <div 
        (dragover)="onDragOver($event)" 
        (dragleave)="onDragLeave($event)" 
        (drop)="onDrop($event)"
        [ngClass]="{'bg-blue-200': isDragOver, 'bg-blue-50': !isDragOver}"
        class="border-4 border-dashed border-blue-200 rounded-lg p-6 text-center transition-colors hover:bg-blue-100 mb-6">
          <label for="file-upload" class="inline-block px-6 py-2 bg-blue-600 text-white font-semibold rounded-md cursor-pointer hover:bg-blue-700 transition">
              1. Carica foto bolletta
          </label>
          <input id="file-upload" type="file" class="hidden" accept="image/*" (change)="onFileSelected($event)">
      </div>

      <div *ngIf="isLoading" class="mt-4 text-center mb-6">
          <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full" role="status"></div>
          <p class="mt-2 text-gray-600">Analisi OCR in corso...</p>
      </div>

      <div *ngIf="showRisultati">
          <div class="mb-8">
              <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Dati Estratti (Modificabili)</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="bg-gray-50 p-3 rounded border">
                      <label class="block text-sm text-gray-500 font-medium">Codice POD / PDR</label>
                      <input type="text" [(ngModel)]="inputPod" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2 font-bold text-gray-800 uppercase">
                  </div>
                  <div class="bg-gray-50 p-3 rounded border">
                      <label class="block text-sm text-gray-500 font-medium">Prezzo Unitario Attuale (€)</label>
                      <input type="number" step="0.0001" [(ngModel)]="inputPrezzoAttuale" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2 font-bold text-red-600">
                  </div>
                  <div class="bg-gray-50 p-3 rounded border">
                      <label class="block text-sm text-gray-500 font-medium">Costi Fissi Attuali (€/anno)</label>
                      <input type="number" [(ngModel)]="inputCostiAttuali" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2">
                  </div>
              </div>
          </div>

          <div>
              <h2 class="text-xl font-semibold text-gray-800 mb-4 border-b pb-2">Dati Nuova Offerta e Consumi</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                      <label class="block text-sm font-medium text-gray-700">IBAN</label>
                      <input type="text" [(ngModel)]="inputIban" placeholder="IT00..." class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2 uppercase">
                  </div>
                  <div>
                      <label class="block text-sm font-medium text-gray-700">Consumo Annuo (kWh/Smc)</label>
                      <input type="number" [(ngModel)]="inputConsumo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2">
                  </div>
                  <div>
                      <label class="block text-sm font-medium text-gray-700">Nuovo Prezzo Unitario (€)</label>
                      <input type="number" step="0.0001" [(ngModel)]="inputPrezzoNuovo" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2">
                  </div>
                  <div>
                      <label class="block text-sm font-medium text-gray-700">Nuovi Costi Fissi (€/anno)</label>
                      <input type="number" [(ngModel)]="inputCostiNuovi" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm border p-2">
                  </div>

                  <div class="md:col-span-2 bg-green-50 p-4 rounded-lg border border-green-200 mt-4 text-center">
                      <!-- Nessun parametro passato qui! -->
                      <button (click)="calcolaRisparmio()" class="bg-green-600 text-white px-8 py-3 rounded-md font-bold text-lg hover:bg-green-700 transition shadow-md">
                          Calcola Risparmio Annuale
                      </button>
                      
                      <div *ngIf="risparmioCalcolato" class="mt-4">
                          <span class="text-gray-600">Risparmio Stimato:</span>
                          <span [ngClass]="{'text-green-600': risparmioTotale >= 0, 'text-red-600': risparmioTotale < 0}" class="block text-4xl font-extrabold mt-1">
                            {{ risparmioTotale | number:'1.2-2' }} €
                          </span>
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <div *ngIf="risparmioCalcolato" class="bg-white p-8 rounded-xl shadow-lg max-w-3xl w-full mt-6 border-t-4 border-yellow-400">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Esporta in Excel</h2>
      
      <div class="flex flex-col md:flex-row items-center gap-4">
          <div class="flex-1 w-full">
              <label class="block text-sm font-medium text-gray-700 mb-2">2. Seleziona il file Excel da aggiornare (.xlsx)</label>
              <input type="file" accept=".xlsx, .xls" (change)="onExcelSelected($event)" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
          </div>
          
          <div class="mt-4 md:mt-0">
              <!-- Nessun parametro passato qui! -->
              <button (click)="aggiornaExcel()" class="bg-yellow-500 text-white px-6 py-3 rounded-md font-bold hover:bg-yellow-600 transition shadow-md w-full">
                  Salva dati su Excel
              </button>
          </div>
      </div>
  </div>
</div>
